server:
  port: 8080

spring:
  application:
    name: ontology-platform

  # JDK 21 虚拟线程：Agent 并发调用时不必为每个请求占一个平台线程
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ontology}
    username: ${DB_USER:ontology}
    password: ${DB_PASSWORD:ontology}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 关闭占位符替换：DDL 注释里有 ${user.siteId}、${tenant} 这类运行时模板，
    # 不关的话 Flyway 会把它们当占位符解析并报 "No value provided for placeholder"
    placeholder-replacement: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ontology:
  # /api/objects/{type} 默认落在哪个域
  domain: maint
  loader:
    enabled: true
    location: classpath:ontology/maint/ontology.yaml

logging:
  level:
    cn.zj.ontology: DEBUG
    org.flywaydb: INFO
