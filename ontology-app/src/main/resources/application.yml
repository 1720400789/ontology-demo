server:
  port: 8080

spring:
  application:
    name: ontology-platform

  # JDK 21 虚拟线程：Agent 并发调用时不必为每个请求占一个平台线程
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ontology_demo}
    username: ${DB_USER:ontology}
    password: ${DB_PASSWORD:ontology}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 关闭占位符替换：DDL 注释里有 ${user.siteId}、${tenant} 这类运行时模板，
    # 不关的话 Flyway 会把它们当占位符解析并报 "No value provided for placeholder"
    placeholder-replacement: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ontology:
  # /api/objects/{type} 默认落在哪个域
  domain: maint
  loader:
    enabled: true
    location: classpath:ontology/maint/ontology.yaml
  agent:
    enabled: true
    # DeepSeek 的 OpenAI 兼容端点；也适用于任何兼容 /chat/completions 的服务
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    # 只从环境变量读，绝不写进仓库
    api-key: ${DEEPSEEK_API_KEY:}
    max-steps: 6
    timeout-seconds: 60

logging:
  level:
    cn.zj.ontology: DEBUG
    org.flywaydb: INFO
